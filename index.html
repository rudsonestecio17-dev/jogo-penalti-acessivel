<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Pênalti Acessível</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      text-align: center;
    }
    canvas {
      background: #2e7d32;
      border: 4px solid #ffffff;
      border-radius: 8px;
      width: 100%;
      height: auto;
      cursor: pointer;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }
    label { font-size: 1.1rem; }
    select {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 4px;
      border: none;
      background: #333;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <!-- Painel de Acessibilidade -->
    <div class="controls">
      <label for="speedSelect"><strong>Velocidade da Seta:</strong></label>
      <select id="speedSelect">
        <option value="0.015">Muito Lenta (Ideal)</option>
        <option value="0.03" selected>Média</option>
        <option value="0.06">Rápida</option>
      </select>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
